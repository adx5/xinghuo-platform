<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星火引力｜品牌增长资源撮合平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-brand { color: #FF6B00; }
        .bg-brand { background-color: #FF6B00; }
        .bg-brand-hover:hover { background-color: #E65C00; }
        .bg-ink-blue { background-color: #0F172A; }
        .bg-ink-light { background-color: #1E293B; }
        .border-brand { border-color: #FF6B00; }
        .glow-effect { box-shadow: 0 0 20px rgba(255, 107, 0, 0.2); }
        .hero-bg {
            background-color: #0F172A;
            background-image: radial-gradient(circle at 15% 50%, rgba(255, 107, 0, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 85% 30%, rgba(255, 107, 0, 0.1) 0%, transparent 50%);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-transition { transition: opacity 0.5s ease-in-out; }
        .fade-out { opacity: 0; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">

    <!-- 顶部导航 -->
    <nav class="bg-ink-blue text-white sticky top-0 z-50 border-b border-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14 sm:h-16 items-center">
                <div class="flex items-center gap-2 sm:gap-3 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                    <div class="w-7 h-7 sm:w-8 sm:h-8 bg-brand rounded-full flex items-center justify-center font-bold text-sm sm:text-lg glow-effect text-white">星</div>
                    <span class="font-bold text-lg sm:text-xl tracking-wider">星火引力</span>
                </div>
                <div class="hidden md:flex space-x-6 text-sm font-medium text-gray-300">
                    <a href="#node-pool" class="hover:text-brand transition">资源库</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 首屏 -->

        <div class="max-w-5xl mx-auto text-center relative z-10">
            <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight mb-4 sm:mb-6 leading-tight">
                <span class="text-brand">聚星火之力</span>，引商业共生
            </h1>
            <p class="text-sm sm:text-lg md:text-xl text-gray-400 mb-6 sm:mb-8 max-w-2xl mx-auto leading-relaxed">
                链接品牌、媒体、达人、广告流量与本地生活服务资源。<br class="hidden sm:block">
            </p>
            <div id="match" class="max-w-3xl mx-auto relative group mt-4">
                <div class="absolute -inset-1 bg-gradient-to-r from-orange-400 to-red-500 rounded-2xl md:rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                <div class="relative flex flex-col md:flex-row bg-white rounded-2xl md:rounded-full shadow-2xl p-2 border border-gray-100 items-center">
                    <div class="flex-grow flex items-center px-3 sm:px-4 w-full">
                        <svg class="w-4 h-4 sm:w-5 sm:h-5 text-gray-400 mr-2 sm:mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" id="requirementInput" placeholder="输入需求，例如：找郑州餐饮探店达人" class="w-full bg-transparent border-none text-gray-800 text-sm sm:text-base md:text-lg py-2.5 sm:py-3 focus:outline-none placeholder-gray-400 fade-transition">
                    </div>
                    <button onclick="submitRequirement()" id="submitBtn" class="mt-2 md:mt-0 bg-brand hover:bg-brand-hover text-white font-bold text-sm sm:text-base md:text-lg py-2.5 md:py-3 px-6 md:px-8 rounded-xl md:rounded-full transition-colors whitespace-nowrap shadow-md w-full md:w-auto">
                        开始智能匹配
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-6 sm:py-10">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">

            <!-- 左侧：引力节点库 (保持不变) -->
            <div id="node-pool" class="lg:col-span-8 space-y-4 sm:space-y-6">
                <div id="demoResultArea" class="mb-4 sm:mb-6 fade-transition">
                    <div id="demoStatusMessage" class="mb-3 sm:mb-4 text-base sm:text-xl font-bold text-brand flex items-center gap-1 fade-transition">
                        <span>✦</span> <span id="demoStatusText">撮合成功：探测到 2 个引力节点！</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                        <div id="demoCard1" class="bg-white rounded-xl p-4 sm:p-5 shadow-sm relative overflow-hidden flex flex-col justify-between border-2 border-brand glow-effect fade-transition">
                            <div class="absolute top-0 right-0 bg-brand text-white text-[10px] sm:text-xs font-bold px-2 sm:px-3 py-0.5 sm:py-1 rounded-bl-lg">引力推荐</div>
                            <div>
                                <div class="flex justify-between items-start mb-1 sm:mb-2 mt-1">

                                </div>
                                <p class="text-gray-600 text-xs sm:text-sm leading-relaxed mb-3 sm:mb-4 line-clamp-3 sm:line-clamp-2"><strong class="text-gray-800">引力理由：</strong><span id="demoCard1Reason"></span></p>
                            </div>
                            <div class="border-t border-gray-100 pt-2 sm:pt-3 mt-auto"><button class="w-full bg-brand text-white text-xs sm:text-sm font-medium py-1.5 sm:py-2 rounded-lg pointer-events-none">申请对接</button></div>
                        </div>
                        <div id="demoCard2" class="bg-white rounded-xl p-4 sm:p-5 shadow-sm relative overflow-hidden flex flex-col justify-between border-2 border-orange-200 fade-transition">
                            <div>
                                <div class="flex justify-between items-start mb-1 sm:mb-2 mt-1">
                                    <h3 id="demoCard2Title" class="text-sm sm:text-base font-bold text-gray-900">引力节点: -</h3>

                    </div>
                </div>

                    <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4"></div>

                <div class="flex justify-between items-end mb-2 mt-6 sm:mt-8">
                    <div>
                        <h2 class="text-xl sm:text-3xl font-bold text-ink-blue mb-1">引力节点库</h2>
                        <p class="text-xs sm:text-sm text-gray-500">实时同步的商业资源链接门户</p>
                    </div>
                </div>
                <div id="resourceList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-5"></div>
            </div>

            <!-- 右侧：发布区 & 留资区 -->
            <div id="publish" class="lg:col-span-4 relative mt-4 lg:mt-0">
                <div class="sticky top-20 sm:top-24 space-y-4 sm:space-y-6">

                    <!-- 模块 A：发布商业资源 -->
                    <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-4 sm:p-5">
                        <h3 class="text-base sm:text-lg font-bold text-gray-900 mb-3 sm:mb-4 flex items-center gap-2">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                            发布您的商业资源
                        </h3>
                        <form onsubmit="return false;" class="space-y-2 sm:space-y-3">
                            <input type="text" id="resName" placeholder="资源名称 (如: 川渝汽车联盟)" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg text-sm focus:outline-none focus:border-brand">
                            <div class="grid grid-cols-2 gap-2">
                                <select id="resIndustry" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg text-sm focus:outline-none focus:border-brand text-gray-700">
                                    <option value="本地生活">本地生活</option>
                                    <option value="传媒广告">传媒广告</option>
                                    <option value="汽车/新能源">汽车/新能源</option>
                                    <option value="食品/快消">食品/快消</option>
                                    <option value="金融/投资">金融/投资</option>
                                    <option value="企业服务">企业服务</option>
                                    <option value="其他">其他行业</option>
                                </select>

                                <!-- 🌟 核心修改：将原来的两个下拉框合为一个带分组的单选下拉框 -->
                                <select id="resRegion" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg text-sm focus:outline-none focus:border-brand text-gray-700">
                                    <option value="全国">全国</option>
                                    <!-- 选项由 JS 动态生成 -->
                                </select>
                            </div>
                            <select id="resType" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg text-sm focus:outline-none focus:border-brand text-gray-700">
                                <option value="短视频/达人">短视频/达人</option>
                                <option value="线下媒体/电梯">线下媒体/电梯</option>
                                <option value="渠道/门店网络">渠道/门店网络</option>
                                <option value="供应链/分销">供应链/分销</option>
                                <option value="资金/投资">资金/投资</option>
                                <option value="技术/代运营">技术/代运营</option>
                                <option value="其他资源">其他资源</option>
                            </select>
                            <textarea id="resDesc" placeholder="详细描述您的资源..." class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg text-sm focus:outline-none focus:border-brand resize-none" rows="2"></textarea>

                            <button type="button" onclick="publishResource()" class="w-full bg-ink-blue hover:bg-gray-800 text-white font-bold text-sm sm:text-base py-2.5 rounded-xl transition-colors shadow-sm mt-2">
                                确认发布资源

                        </form>
                    </div>

                    <!-- 模块 B：纯需求留资 -->
                    <div class="bg-gray-900 rounded-2xl shadow-md p-5 text-white">
                        <h3 class="text-base font-bold mb-2 flex items-center gap-2">
                            <span class="text-yellow-500 text-xl">👑</span> 找不到资源？直接留资

                        <form onsubmit="return false;" class="space-y-2">
                            <input type="text" id="vipLeadName" placeholder="您的称呼 (如: 王总)" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-brand">
                            <input type="text" id="vipLeadContact" placeholder="电话 / 微信" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-brand">
                            <input type="text" id="vipLeadAddress" placeholder="所在地址" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-brand">
                            <textarea id="vipLeadMsg" placeholder="您的需求（如：想在郑州找餐饮探店达人）..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-brand resize-none" rows="2"></textarea>

                            <button type="button" onclick="submitDemandLead()" class="w-full bg-brand hover:bg-brand-hover text-white font-bold text-sm py-2.5 rounded-xl transition-colors shadow-sm mt-2">

    <!-- 发布服务选择弹窗 (保持上一版逻辑) -->
    <div id="publishServiceModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all scale-95 opacity-0" id="publishServiceModalContent">
            <div class="bg-ink-blue px-6 py-4 text-center">
                <h3 class="font-bold text-xl text-white">选择发布方案</h3>
                <p class="text-sm text-gray-400 mt-1">您的资源已准备好，请选择展示方式</p>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div class="border border-gray-200 rounded-xl p-4 flex items-center justify-between hover:bg-gray-50 transition cursor-pointer" onclick="confirmPublish(false)">
                        <div>
                            <h4 class="font-bold text-gray-800 text-lg">普通展示</h4>
                            <p class="text-xs text-gray-500 mt-1">在资源库按时间展示</p>
                        </div>
                        <button class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-6 rounded-lg transition">免费发布</button>
                    </div>
                    <div class="border-2 border-brand rounded-xl p-4 flex items-center justify-between bg-orange-50/50 relative overflow-hidden cursor-pointer" onclick="confirmPublish(true)">
                        <div class="absolute top-0 right-0 bg-brand text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg">推荐</div>
                        <div>
                            <h4 class="font-bold text-brand text-lg flex items-center gap-2">引力加速 <span class="text-sm bg-brand text-white px-2 py-0.5 rounded">¥99</span></h4>
                            <p class="text-xs text-gray-600 mt-1">抢占首页推荐位，优先对接</p>
                        </div>
                        <button class="bg-brand hover:bg-brand-hover text-white font-bold py-2 px-6 rounded-lg transition shadow-md">立即支付</button>
                    </div>
                </div>
                <div class="text-center mt-6">
                    <button onclick="closePublishServiceModal()" class="text-gray-400 hover:text-gray-600 text-sm underline">返回修改内容</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 线索弹窗、Toast等保持原样，如果嫌长可以直接用你之前的文件合并 -->
    <div id="leadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-3 sm:p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-95 opacity-0" id="leadModalContent">
            <div class="bg-ink-blue px-4 sm:px-6 py-3 sm:py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-base sm:text-lg">申请对接资源</h3>
                <button type="button" onclick="closeLeadModal()" class="text-gray-400 hover:text-white text-xl sm:text-2xl leading-none">&times;</button>
            </div>
            <div class="p-4 sm:p-6">
                <div class="mb-3 sm:mb-4">
                    <p class="text-xs sm:text-sm text-gray-500 mb-1">您正在对接：</p>
                    <p id="modalResourceName" class="font-bold text-brand text-base sm:text-lg truncate"></p>
                </div>
                <form onsubmit="return false;" class="space-y-3 sm:space-y-4">
                    <div>
                        <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">您的称呼</label>
                        <input type="text" id="leadName" placeholder="如：王总 / 李经理" class="w-full border border-gray-300 rounded-lg p-2 sm:p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-brand focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">联系方式 (手机/微信)</label>
                        <input type="text" id="leadContact" placeholder="方便对方与您联系" class="w-full border border-gray-300 rounded-lg p-2 sm:p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-brand focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">地址 (选填)</label>
                        <input type="text" id="leadAddress" placeholder="所在城市或地址" class="w-full border border-gray-300 rounded-lg p-2 sm:p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-brand focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">补充留言 (选填)</label>
                        <textarea id="leadMessage" rows="2" placeholder="简单描述您的合作意向..." class="w-full border border-gray-300 rounded-lg p-2 sm:p-2.5 text-sm sm:text-base focus:ring-2 focus:ring-brand focus:outline-none resize-none"></textarea>
                    </div>
                </form>
                <div class="flex gap-3 mt-4 sm:mt-6">
                    <button type="button" onclick="closeLeadModal()" class="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 sm:py-3 rounded-xl transition text-sm sm:text-base">返回</button>
                    <button type="button" onclick="submitLead()" class="w-2/3 bg-brand hover:bg-brand-hover text-white font-bold py-2.5 sm:py-3 rounded-xl transition shadow-lg text-sm sm:text-base">确认提交意向</button>
                </div>
            </div>
        </div>
    </div>

    <div id="customToast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-2xl z-[200] text-sm font-medium transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-2">
        <span id="toastIcon">✨</span>
        <span id="toastMessage"></span>
    </div>

    <script>
        let demoIndex = 0, demoTimer = null, isHoveringDemo = false;
        let regionData = { regions: {}, cities: {} };
        let currentResources = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchRegions();
            fetchResourceList();
            playDemoAnimation();
            demoTimer = setInterval(playDemoAnimation, 6000);
            const demoAreaEl = document.getElementById('demoResultArea');
            if(demoAreaEl) {
                demoAreaEl.addEventListener('mouseenter', () => { isHoveringDemo = true; });
                demoAreaEl.addEventListener('mouseleave', () => { isHoveringDemo = false; });
            }
        });

        // 🌟 修复：合并下拉框
        async function fetchRegions() {
            try {
                const response = await fetch('https://xinghuo-backend.fastapicloud.dev/api/regions');
                const data = await response.json();
                regionData = data;
                const selectEl = document.getElementById('resRegion');

                // 保留原来的“全国”选项，清空后面的
                selectEl.innerHTML = '<option value="全国">全国</option>';

                // 遍历大区和省份，生成 optgroup
                for (const group in data.regions) {
                    // 跳过“全国”，因为上面已经写死了
                    if (group === "全国") continue;

                    const optgroup = document.createElement('optgroup');
                    optgroup.label = group; // 大区作为分组名

                    const provinces = data.regions[group] || [];
                    provinces.forEach(prov => {
                        const option = document.createElement('option');
                        // 将大区和省份拼接成最终提交的值，如 "华中地区（河南）"
                        option.value = `${group}（${prov}）`;
                        option.text = prov;
                        optgroup.appendChild(option);
                    });
                    selectEl.appendChild(optgroup);
                }
            } catch (e) { console.error("加载地域失败", e); }
        }

        // 发布资源逻辑
        function publishResource() {
            const name = document.getElementById('resName').value;
            const desc = document.getElementById('resDesc').value;
            if(!name || !desc) { showToast("资源名称和详细描述不能为空", "⚠️"); return; }

            const modal = document.getElementById('publishServiceModal');
            const content = document.getElementById('publishServiceModalContent');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closePublishServiceModal() {
            const modal = document.getElementById('publishServiceModal');
            const content = document.getElementById('publishServiceModalContent');
            content.classList.remove('scale-100', 'opacity-100'); content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }

        async function confirmPublish(isVip) {
            if (isVip) showToast("💳 模拟支付成功！资源将获得优先推荐", "🚀");
            closePublishServiceModal();

            const data = {
                name: document.getElementById('resName').value,
                industry: document.getElementById('resIndustry').value,
                region: document.getElementById('resRegion').value, // 直接拿选中的完整值
                resource_type: document.getElementById('resType').value,
                description: document.getElementById('resDesc').value,
                is_vip: isVip
            };

            try {
                const res = await fetch('https://xinghuo-backend.fastapicloud.dev/api/resources', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
                });
                if (res.ok) {
                    document.getElementById('resName').value = ''; document.getElementById('resDesc').value = '';
                    await fetchResourceList();
                    showToast("引力节点发布成功！", "🎉");
