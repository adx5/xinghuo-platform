<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星火引力 - 运营管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-brand { color: #FF6B00; }
        .bg-brand { background-color: #FF6B00; }
        .bg-ink-blue { background-color: #0F172A; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased flex h-screen overflow-hidden">

    <!-- 登录遮罩层 -->
    <div id="loginScreen" class="fixed inset-0 bg-ink-blue flex items-center justify-center z-[999]">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center">
            <div class="w-16 h-16 bg-brand rounded-full flex items-center justify-center text-3xl text-white font-bold mx-auto mb-6">星</div>
            <h2 class="text-2xl font-bold mb-2">星火引力后台</h2>
            <p class="text-gray-500 text-sm mb-6">请输入管理密码</p>
            <input type="password" id="loginPassword" class="w-full border border-gray-300 rounded-lg p-3 text-center mb-4 focus:ring-2 focus:ring-brand outline-none" placeholder="••••••••">
            <button onclick="handleLogin()" class="w-full bg-brand hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition">进入系统</button>
        </div>
    </div>

    <!-- 主体内容 (默认隐藏) -->
    <div id="mainApp" class="flex w-full h-full hidden">
        <!-- 左侧侧边栏 -->
        <aside class="w-64 bg-ink-blue text-white flex flex-col shadow-xl z-20">
            <div class="h-16 flex items-center px-6 border-b border-gray-800">
                <div class="w-8 h-8 bg-brand rounded-full flex items-center justify-center font-bold text-lg text-white mr-3">星</div>
                <span class="font-bold text-xl tracking-wider">星火引力</span>
            </div>
            <nav class="flex-1 py-6 space-y-2">
                <a href="#" id="nav-dashboard" onclick="switchTab('dashboard')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">数据仪表盘</a>
                <a href="#" id="nav-leads" onclick="switchTab('leads')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">对接线索池</a>
                <a href="#" id="nav-contacts" onclick="switchTab('contacts')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">客户通讯录</a>
                <a href="#" id="nav-resources" onclick="switchTab('resources')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">资源管理</a>
                <a href="#" id="nav-vips" onclick="switchTab('vips')" class="flex items-center px-6 py-3 bg-brand/10 text-brand border-r-4 border-brand font-medium transition">大客户管理</a>
            </nav>
            <div class="mt-auto p-6 border-t border-gray-800 text-xs text-gray-500 text-center">
                郑州普耀文化传媒<br>© 2026 星火引力
                <button onclick="logout()" class="mt-2 text-red-400 hover:text-red-300 block w-full text-center">退出登录</button>
            </div>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="flex-1 flex flex-col relative overflow-hidden bg-gray-50">
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
                <h2 id="pageTitle" class="text-lg font-bold text-gray-800">大客户管理</h2>
                <div class="flex items-center gap-4">
                    <a href="https://adx5.github.io/xinghuo-platform/" target="_blank" class="text-sm text-gray-500 hover:text-brand transition flex items-center gap-1.5 border-r border-gray-200 pr-4">返回前台</a>
                    <button onclick="refreshCurrentTab()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-4 rounded transition">刷新数据</button>
                </div>
            </header>

            <!-- 1. 仪表盘 -->
            <div id="tab-dashboard" class="hidden flex-1 p-8 overflow-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <p class="text-sm text-gray-500 mb-1">平台资源总数</p>
                        <h3 id="stat-resources" class="text-3xl font-bold text-gray-900">0</h3>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <p class="text-sm text-gray-500 mb-1">收到对接线索</p>
                        <h3 id="stat-leads" class="text-3xl font-bold text-brand">0</h3>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <p class="text-sm text-gray-500 mb-1">VIP置顶资源</p>
                        <h3 id="stat-vip" class="text-3xl font-bold text-yellow-600">0</h3>
                    </div>
                </div>
            </div>

            <!-- 2. 线索池 (统一风格) -->
            <div id="tab-leads" class="hidden flex-1 p-8 overflow-auto">
                <div class="mb-4 flex justify-between items-center">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800">对接线索池</h3>
                        <p class="text-sm text-gray-500">按时间倒序展示所有客户对接意向</p>
                    </div>
                    <button onclick="exportLeadsToExcel()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        导出 Excel
                    </button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b">
                            <th class="py-4 px-6 font-medium">目标资源</th>
                            <th class="py-4 px-6 font-medium">称呼</th>
                            <th class="py-4 px-6 font-medium">联系方式</th>
                            <th class="py-4 px-6 font-medium">地址</th>
                            <th class="py-4 px-6 font-medium">备注/留言</th>
                        </tr></thead>
                        <tbody id="leadsTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 3. 客户通讯录 (统一风格) -->
            <div id="tab-contacts" class="hidden flex-1 p-8 overflow-auto">
                <div class="mb-4 flex justify-between items-center">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800">客户通讯录</h3>
                        <p class="text-sm text-gray-500">自动汇总、去重后的核心客户资产</p>
                    </div>
                    <button onclick="exportContacts()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        导出 Excel
                    </button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b">
                            <th class="py-4 px-6 font-medium">客户姓名</th>
                            <th class="py-4 px-6 font-medium">联系方式</th>
                            <th class="py-4 px-6 font-medium">意向资源</th>
                            <th class="py-4 px-6 font-medium">地址</th>
                            <th class="py-4 px-6 font-medium">操作</th>
                        </tr></thead>
                        <tbody id="contactsTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 4. 资源管理 (含批量操作) -->
            <div id="tab-resources" class="hidden flex-1 p-8 overflow-auto">
                <div id="batchActionBar" class="hidden mb-4 bg-blue-50 border border-blue-200 rounded-lg p-3 flex items-center justify-between">
                    <div class="text-sm text-blue-800 font-medium">已选中 <span id="selectedCount" class="font-bold text-lg">0</span> 项</div>
                    <div class="flex gap-3">
                        <button onclick="batchUpdateVip(true)" class="text-sm bg-brand text-white px-3 py-1.5 rounded hover:bg-brand-hover">设为置顶</button>
                        <button onclick="batchUpdateVip(false)" class="text-sm bg-gray-500 text-white px-3 py-1.5 rounded hover:bg-gray-600">取消置顶</button>
                        <button onclick="batchDelete()" class="text-sm bg-red-500 text-white px-3 py-1.5 rounded hover:bg-red-600">批量删除</button>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b">
                            <th class="py-4 px-4 w-12 text-center"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" class="w-4 h-4 cursor-pointer"></th>
                            <th class="py-4 px-4 font-medium">编码</th><th class="py-4 px-4 font-medium">资源名称</th><th class="py-4 px-4 font-medium">行业/地域</th><th class="py-4 px-4 font-medium">状态</th><th class="py-4 px-6 text-right">操作</th>
                        </tr></thead>
                        <tbody id="resourcesTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 5. 大客户管理 -->
            <div id="tab-vips" class="flex-1 p-8 overflow-auto">
                <div class="mb-6 flex justify-between items-center">
                    <div><h3 class="text-xl font-bold text-gray-800">大客户微官网列表</h3></div>
                    <button onclick="openVipModal()" class="bg-ink-blue hover:bg-gray-800 text-white px-4 py-2 rounded-lg text-sm transition">+ 发布大客户</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b"><th class="py-4 px-6 font-medium">预览图</th><th class="py-4 px-6 font-medium">公司名称</th><th class="py-4 px-6 font-medium">状态</th><th class="py-4 px-6 text-right">操作</th></tr></thead>
                        <tbody id="vipTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 发布大客户弹窗 -->
    <div id="vipModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all scale-95 opacity-0" id="vipModalContent">
            <div class="bg-ink-blue px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg">发布大客户微官网</h3>
                <button onclick="closeVipModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto space-y-4">
                <div><label class="block text-sm font-medium mb-1">公司名称 / 标题</label><input type="text" id="vipTitle" class="w-full border p-2.5 rounded-lg focus:border-brand outline-none"></div>
                <div><label class="block text-sm font-medium mb-1">轮播大图链接 (1920x600)</label><input type="text" id="vipBannerUrl" class="w-full border p-2.5 rounded-lg text-xs focus:border-brand outline-none" placeholder="https://..."></div>
                <div><label class="block text-sm font-medium mb-1">宣传口号</label><input type="text" id="vipSlogan" class="w-full border p-2.5 rounded-lg focus:border-brand outline-none"></div>
                <div><label class="block text-sm font-medium mb-1">企业实力介绍 (换行展示)</label><textarea id="vipIntro" rows="4" class="w-full border p-2.5 rounded-lg focus:border-brand outline-none"></textarea></div>
                <div><label class="block text-sm font-medium mb-1">产品图集 (图片链接，用逗号隔开)</label><textarea id="vipGallery" rows="2" class="w-full border p-2.5 rounded-lg text-xs focus:border-brand outline-none" placeholder="https://img1.jpg, https://img2.jpg"></textarea></div>
                <div><label class="block text-sm font-medium mb-1">合作案例 (多条用逗号隔开)</label><textarea id="vipCases" rows="3" class="w-full border p-2.5 rounded-lg text-xs focus:border-brand outline-none" placeholder="服务某餐饮品牌, 达成某战略合作"></textarea></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">联系电话</label><input type="text" id="vipPhone" class="w-full border p-2.5 rounded-lg focus:border-brand outline-none"></div>
                    <div><label class="block text-sm font-medium mb-1">微信号</label><input type="text" id="vipWechat" class="w-full border p-2.5 rounded-lg focus:border-brand outline-none"></div>
                </div>
                <div><label class="block text-sm font-medium mb-1">外链 (官网/抖音)</label><input type="text" id="vipExtLink" class="w-full border p-2.5 rounded-lg text-xs focus:border-brand outline-none"></div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end gap-3">
                <button onclick="closeVipModal()" class="px-4 py-2 text-gray-600 bg-white border rounded-lg">取消</button>
                <button onclick="saveVip()" class="px-4 py-2 bg-brand text-white rounded-lg hover:bg-brand-hover shadow-md">保存并上线</button>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'vips';
        let adminToken = localStorage.getItem('adminToken') || '';
        let selectedIds = new Set();
        let currentResources = [];
        let allLeadsData = [];

        // 🌟 全局请求拦截器（仅自动带上 Token，绝不踢人）
        const originalFetch = window.fetch;
        window.fetch = function() {
            let [resource, config] = arguments;
            if (typeof resource === 'string' && resource.includes('/api/')) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['Authorization'] = `Bearer ${adminToken}`;
            }
            return originalFetch.apply(this, arguments);
        };

        function handleLogin() {
            const pwd = document.getElementById('loginPassword').value;
            fetch('https://xinghuo-backend.fastapicloud.dev/api/admin/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd })
            }).then(res => {
                if (res.ok) return res.json();
                throw new Error("密码错误");
            }).then(data => {
                adminToken = data.token;
                localStorage.setItem('adminToken', adminToken);
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                switchTab('dashboard');
            }).catch(err => { alert(err.message); });
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.reload();
        }

        if (adminToken) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.addEventListener('DOMContentLoaded', () => switchTab('dashboard'));
        }

        function switchTab(tabId) {
            currentTab = tabId;
            ['dashboard','leads','contacts','resources','vips'].forEach(id => {
                document.getElementById('nav-'+id).className = "flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition";
                document.getElementById('tab-'+id).classList.add('hidden');
            });
            document.getElementById('nav-'+tabId).className = "flex items-center px-6 py-3 bg-brand/10 text-brand border-r-4 border-brand font-medium transition";
            document.getElementById('tab-'+tabId).classList.remove('hidden');

            const titles = { dashboard: '数据仪表盘', leads: '对接线索池', contacts: '客户通讯录', resources: '资源管理', vips: '大客户管理' };
            document.getElementById('pageTitle').innerText = titles[tabId];

            if (tabId === 'dashboard') fetchStats();
            if (tabId === 'leads' || tabId === 'contacts') fetchLeadsAndContacts();
            if (tabId === 'resources') fetchResources();
            if (tabId === 'vips') fetchVips();
        }
        function refreshCurrentTab() { switchTab(currentTab); }

        // 1. 仪表盘
        async function fetchStats() {
            try {
                const response = await fetch('https://xinghuo-backend.fastapicloud.dev/api/admin/stats');
                const data = await response.json();
                document.getElementById('stat-resources').innerText = data.total_resources;
                document.getElementById('stat-leads').innerText = data.total_leads;
                document.getElementById('stat-vip').innerText = data.total_vip;
            } catch (error) { console.error(error); }
        }

        // 2. 线索池 & 通讯录
        async function fetchLeadsAndContacts() {
            try {
                const res = await fetch('https://xinghuo-backend.fastapicloud.dev/api/leads');
                const data = await res.json();
                allLeadsData = data.leads || [];

                // 渲染线索池
                const leadsTbody = document.getElementById('leadsTableBody');
                if (allLeadsData.length === 0) { leadsTbody.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-gray-400">暂无线索</td></tr>'; }
                else {
                    leadsTbody.innerHTML = '';
                    allLeadsData.forEach(l => {
                        leadsTbody.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="py-4 px-6"><span class="font-bold text-brand">${l.resource_name || '未知资源'}</span></td>
                                <td class="py-4 px-6 font-medium">${l.client_name || '匿名'}</td>
                                <td class="py-4 px-6 font-mono text-gray-600">${l.contact_info || '-'}</td>
                                <td class="py-4 px-6 text-gray-500">${l.address || '-'}</td>
                                <td class="py-4 px-6 text-gray-500">${l.message || '-'}</td>
                            </tr>
                        `;
                    });
                }

                // 渲染通讯录（去重取最新）
                const contactsTbody = document.getElementById('contactsTableBody');
                const uniqueContacts = new Map();
                allLeadsData.forEach(l => {
                    if (l.contact_info) uniqueContacts.set(l.contact_info, l);
                });
                const contactList = Array.from(uniqueContacts.values());

                if (contactList.length === 0) { contactsTbody.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-gray-400">暂无沉淀客户</td></tr>'; }
                else {
                    contactsTbody.innerHTML = '';
                    contactList.forEach(c => {
                        contactsTbody.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="py-4 px-6 font-bold text-gray-800">${c.client_name || '匿名'}</td>
                                <td class="py-4 px-6 font-mono text-brand font-bold cursor-pointer hover:underline" onclick="navigator.clipboard.writeText('${c.contact_info}');alert('已复制')">${c.contact_info}</td>
                                <td class="py-4 px-6 text-gray-600">${c.resource_name || '纯需求客户'}</td>
                                <td class="py-4 px-6 text-gray-500">${c.address || '-'}</td>
                                <td class="py-4 px-6 text-right">
                                    <span class="text-xs bg-brand/10 text-brand px-2 py-1 rounded">意向客户</span>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch(e) { console.error(e); }
        }

        function exportLeadsToExcel() {
            if(allLeadsData.length === 0) return alert("暂无数据");
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "目标资源,客户称呼,联系方式,地址,留言\n";
            allLeadsData.forEach(l => {
                csvContent += `"${l.resource_name}","${l.client_name}","${l.contact_info}","${l.address||''}","${l.message||''}"\n`;
            });
            downloadCSV(csvContent, "星火引力_线索池.csv");
        }

        function exportContacts() {
            if(allLeadsData.length === 0) return alert("暂无数据");
            const uniqueContacts = new Map();
            allLeadsData.forEach(l => { if (l.contact_info) uniqueContacts.set(l.contact_info, l); });

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "客户姓名,联系方式,意向资源,地址,留言\n";
            uniqueContacts.forEach(c => {
                csvContent += `"${c.client_name}","${c.contact_info}","${c.resource_name}","${c.address||''}","${c.message||''}"\n`;
            });
            downloadCSV(csvContent, "星火引力_客户通讯录.csv");
        }

        function downloadCSV(csvContent, fileName) {
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 3. 资源管理
        async function fetchResources() {
            const tbody = document.getElementById('resourcesTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">加载中...</td></tr>';
            try {
                const response = await fetch('https://xinghuo-backend.fastapicloud.dev/api/resources');
                const data = await response.json();
                currentResources = data.resources || [];

                selectedIds.clear();
                document.getElementById('selectAll').checked = false;
                updateBatchBar();

                if (currentResources.length > 0) {
                    tbody.innerHTML = '';
                    currentResources.forEach(res => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="py-4 px-4 text-center">
                                    <input type="checkbox" value="${res.id}" onchange="toggleRowSelect(this)" class="w-4 h-4 text-brand rounded focus:ring-brand cursor-pointer row-checkbox">
                                </td>
                                <td class="py-4 px-4 font-mono text-xs text-brand font-bold">${res.resource_code || '-'}</td>
                                <td class="py-4 px-4 font-bold text-gray-800 max-w-xs truncate" title="${res.name}">${res.name}</td>
                                <td class="py-4 px-4 text-gray-500 text-xs">
                                    <span class="block">${res.industry}</span>
                                    <span class="block">${res.region}</span>
                                </td>
                                <td class="py-4 px-4">
                                    ${res.is_vip
                                        ? '<span class="text-xs bg-brand/10 text-brand font-bold px-2 py-1 rounded">VIP置顶</span>'
                                        : '<span class="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded">普通</span>'}
                                </td>
                                <td class="py-4 px-6 text-right space-x-2">
                                    <button onclick="deleteResourceAdmin(${res.id}, '${res.name}')" class="text-xs bg-red-50 text-red-600 hover:bg-red-500 hover:text-white py-1 px-3 rounded transition">删除</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-gray-400"><div class="text-4xl mb-2">📦</div>暂无发布资源</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-red-500">加载失败。</td></tr>';
            }
        }

        function toggleRowSelect(checkbox) {
            const id = parseInt(checkbox.value);
            if (checkbox.checked) selectedIds.add(id);
            else { selectedIds.delete(id); document.getElementById('selectAll').checked = false; }
            updateBatchBar();
        }

        function toggleSelectAll(selectAllCheckbox) {
            const isChecked = selectAllCheckbox.checked;
            document.querySelectorAll('.row-checkbox').forEach(cb => {
                cb.checked = isChecked;
                const id = parseInt(cb.value);
                if (isChecked) selectedIds.add(id);
                else selectedIds.delete(id);
            });
            updateBatchBar();
        }

        function updateBatchBar() {
            const bar = document.getElementById('batchActionBar');
            document.getElementById('selectedCount').innerText = selectedIds.size;
            if (selectedIds.size > 0) bar.classList.remove('hidden');
            else bar.classList.add('hidden');
        }

        async function deleteResourceAdmin(id, name) {
            if (!confirm(`⚠️ 确定要下架并删除资源【${name}】吗？`)) return;
            try {
                const res = await fetch(`https://xinghuo-backend.fastapicloud.dev/api/resources/${id}`, { method: 'DELETE' });
                if (res.ok) { alert("✅ 资源已删除"); fetchResources(); }
                else alert("删除失败");
            } catch (e) { alert("网络错误"); }
        }

        async function batchDelete() {
            if (!confirm(`⚠️ 确定要删除选中的 ${selectedIds.size} 条资源吗？该操作不可逆！`)) return;
            try {
                const res = await fetch('https://xinghuo-backend.fastapicloud.dev/api/resources/batch_delete', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: Array.from(selectedIds) })
                });
                if (res.ok) { alert("✅ 批量删除成功"); fetchResources(); }
                else alert("删除失败");
            } catch (e) { alert("网络错误"); }
        }

        async function batchUpdateVip(isVip) {
            try {
                const res = await fetch(`https://xinghuo-backend.fastapicloud.dev/api/resources/batch_vip?is_vip=${isVip}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: Array.from(selectedIds) })
                });
                if (res.ok) { alert(`✅ 成功更新为${isVip ? 'VIP' : '普通'}状态`); fetchResources(); }
                else alert("更新失败");
            } catch (e) { alert("网络错误"); }
        }

        // 4. 大客户管理
        async function fetchVips() {
            const tbody = document.getElementById('vipTableBody');
            try {
                const res = await fetch('https://xinghuo-backend.fastapicloud.dev/api/admin/vips');
                const data = await res.json();
                if (data.vips.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="py-10 text-center text-gray-400">暂无大客户</td></tr>'; return; }
                tbody.innerHTML = '';
                data.vips.forEach(v => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="py-3 px-6"><img src="${v.banner_url}" class="h-12 w-32 object-cover rounded border"></td>
                            <td class="py-3 px-6 font-bold">${v.title}</td>
                            <td class="py-3 px-6">${v.is_active ? '<span class="text-green-600 text-xs bg-green-50 px-2 py-1 rounded">展示中</span>' : '<span class="text-gray-500 text-xs bg-gray-100 px-2 py-1 rounded">已下架</span>'}</td>
                            <td class="py-3 px-6 text-right space-x-2">
                                <a href="vip.html?id=${v.id}" target="_blank" class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded">预览</a>
                                <button onclick="toggleVip(${v.id})" class="text-xs border px-2 py-1 rounded hover:bg-gray-100">${v.is_active ? '下架' : '上架'}</button>
                                <button onclick="deleteVip(${v.id})" class="text-xs text-red-600 border border-red-200 px-2 py-1 rounded">删除</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        function openVipModal() {
            document.querySelectorAll('#vipModal input, #vipModal textarea').forEach(el => el.value = '');
            const modal = document.getElementById('vipModal'); const content = document.getElementById('vipModalContent');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);
        }
        function closeVipModal() {
            const modal = document.getElementById('vipModal'); const content = document.getElementById('vipModalContent');
            content.classList.remove('scale-100', 'opacity-100'); content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }
        async function saveVip() {
            const data = {
                title: document.getElementById('vipTitle').value, banner_url: document.getElementById('vipBannerUrl').value,
                slogan: document.getElementById('vipSlogan').value, intro: document.getElementById('vipIntro').value,
                gallery_urls: document.getElementById('vipGallery').value, cases: document.getElementById('vipCases').value,
                phone: document.getElementById('vipPhone').value, wechat: document.getElementById('vipWechat').value,
                ext_link: document.getElementById('vipExtLink').value, sort_order: 0
            };
            if(!data.title || !data.banner_url) { alert("名称和大图链接不能为空"); return; }
            try {
                const res = await fetch('https://xinghuo-backend.fastapicloud.dev/api/admin/vips', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                if(res.ok) { closeVipModal(); fetchVips(); } else { alert("失败"); }
            } catch(e) { alert("网络错误"); }
        }
        async function toggleVip(id) { await fetch(`https://xinghuo-backend.fastapicloud.dev/api/admin/vips/${id}/toggle`, { method: 'PUT' }); fetchVips(); }
        async function deleteVip(id) { if(confirm('确定删除吗？')) { await fetch(`https://xinghuo-backend.fastapicloud.dev/api/admin/vips/${id}`, { method: 'DELETE' }); fetchVips(); } }
    </script>
</body>
</html>
